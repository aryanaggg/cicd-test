name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      
      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Tests
        run: |
          pytest
      
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Docker Image
        run: |
          # docker build -t cicd-demo .
          # docker build -t ghcr.io/aryanaggg/cicd-demo:latest .

          # this builds one image and copies it with two tags
          docker build \
            -t ghcr.io/aryanaggg/cicd-demo:latest \
            -t ghcr.io/aryanaggg/cicd-demo:${{ github.sha }} \
            .
      
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/aryanaggg/cicd-demo:latest
          docker push ghcr.io/aryanaggg/cicd-demo:${{ github.sha }}
          